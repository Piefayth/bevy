[package]
name = "bevy_ui_render_retained"
version = "0.1.0"
edition = "2024"
description = "A damage-tracked retained renderer for Bevy UI"
homepage = "https://github.com/bevyengine/bevy"
repository = "https://github.com/bevyengine/bevy"
license = "MIT OR Apache-2.0"
keywords = ["bevy", "ui", "rendering"]

[features]
stress_test = [
  "bevy/bevy_winit",
  "bevy/default_font",
  "bevy/multi_threaded",
  "bevy/wayland",
  "bevy/x11",
]

[dependencies]
bevy = { path = "../..", version = "0.19.0", default-features = false, features = [
  "std",
  "ui_bevy_render",
] }

[dev-dependencies]
bevy_app = { path = "../bevy_app", version = "0.19.0" }
bevy_core_pipeline = { path = "../bevy_core_pipeline", version = "0.19.0" }
bevy_ecs = { path = "../bevy_ecs", version = "0.19.0" }
bevy_render = { path = "../bevy_render", version = "0.19.0" }
bevy_text = { path = "../bevy_text", version = "0.19.0", features = ["default_font"] }
bevy_ui = { path = "../bevy_ui", version = "0.19.0" }

[[example]]
name = "stress_test"
required-features = ["stress_test"]

[lints]
workspace = true
